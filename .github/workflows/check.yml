name: check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax
        run: python -m py_compile agent/novum_agent.py

      - name: Extension JavaScript syntax
        shell: pwsh
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest ok')"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/install.ps1', 'scripts/smoke-test.ps1', 'scripts/quick-install.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: One-click installer smoke
        shell: pwsh
        run: ./scripts/quick-install.ps1 -NoLaunch

      - name: HTTP smoke test
        shell: pwsh
        run: |
          $health = Invoke-RestMethod 'http://127.0.0.1:8765/health'
          if (-not $health.ok) { throw 'health failed' }
          $token = (Get-Content -Raw (Join-Path $env:USERPROFILE '.novum-pc-bridge\token.txt')).Trim()
          $headers = @{ 'X-Novum-Token' = $token }
          $body = @{ tool = 'pc.status'; args = @{} } | ConvertTo-Json -Depth 5
          $status = Invoke-RestMethod 'http://127.0.0.1:8765/tool' -Method Post -Headers $headers -ContentType 'application/json' -Body $body
          if (-not $status.ok) { throw 'pc.status failed' }
          if (-not $status.result.allow_shell) { throw 'quick installer did not enable shell' }
          $localConfig = Join-Path $env:LOCALAPPDATA 'NOVUM-ChatGPT\extension\local-config.js'
          if (-not (Test-Path $localConfig)) { throw 'extension bootstrap token file missing' }
          Write-Host "One-click bridge OK: $($status.result.user)@$($status.result.hostname)"

      - name: Stop agent
        if: always()
        shell: pwsh
        run: |
          Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
