<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NOVUM PC Bridge</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { width: 320px; margin: 0; background: #0b0d10; color: #f4f4f5; }
    main { padding: 16px; display: grid; gap: 12px; }
    h1 { font-size: 16px; margin: 0; }
    p { margin: 0; color: #a1a1aa; font-size: 12px; line-height: 1.4; }
    label { display: grid; gap: 5px; font-size: 12px; color: #d4d4d8; }
    input[type="text"], input[type="password"] { box-sizing: border-box; width: 100%; border: 1px solid #2b3038; border-radius: 8px; background: #12161b; color: white; padding: 9px 10px; outline: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card { border: 1px solid #252a31; border-radius: 10px; background: #101318; padding: 11px; display: grid; gap: 9px; }
    button { cursor: pointer; border: 1px solid #303640; border-radius: 8px; padding: 9px 10px; background: #1a2028; color: white; font-weight: 600; }
    button.primary { background: #f4f4f5; color: #09090b; border-color: #f4f4f5; }
    button:hover { filter: brightness(1.12); }
    #status { font-size: 12px; min-height: 17px; color: #a1a1aa; word-break: break-word; }
    #status.ok { color: #86efac; }
    #status.bad { color: #fca5a5; }
    small { color: #71717a; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>NOVUM PC Bridge</h1>
      <p>ChatGPT Web ↔ your Windows PC</p>
    </div>

    <label>Agent URL
      <input id="baseUrl" type="text" value="http://127.0.0.1:8765" />
    </label>

    <label>Pairing token
      <input id="token" type="password" placeholder="Paste token printed by novum_agent.py" />
    </label>

    <div class="card">
      <div class="row">
        <span>Arm tool execution</span>
        <input id="armed" type="checkbox" />
      </div>
      <div class="row">
        <span>Auto-send results</span>
        <input id="autoSend" type="checkbox" checked />
      </div>
    </div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test agent</button>
    </div>

    <button id="inject" class="primary">Inject protocol into ChatGPT</button>
    <div id="status"></div>
    <small>Keep the bridge disarmed when you do not want ChatGPT to execute local tools.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
